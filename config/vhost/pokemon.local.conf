<VirtualHost *:80>
    ServerName pokemon.local

    DocumentRoot /var/www/html/PokemonTracker/public

    <Directory /var/www/html/PokemonTracker/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/pokemon-error.log
    CustomLog ${APACHE_LOG_DIR}/pokemon-access.log combined
</VirtualHost>